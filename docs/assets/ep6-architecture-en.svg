<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="16" fill="url(#bg)"/>
  <text x="40" y="48" fill="#f8fafc" font-size="24" font-weight="700">Evolving Profile 6.0.0 — Unified Architecture</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Cross-Host Event Bus · Semantic Ingestion Gate · Unified Model Router &amp; Scheduler Daemon · Bi-Temporal State &amp; Auditable Recall</text>

  <!-- Layer 1: Multi-Host -->
  <rect x="40" y="96" width="1040" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="96" width="6" height="74" rx="3" fill="url(#gBlue)"/>
  <text x="64" y="122" fill="#38bdf8" font-size="13" font-weight="700">Multi-Host Surface Layer (MCP + Hooks + Native Transcript Adapters)</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="64" y="134" width="120" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="124" y="150" text-anchor="middle">Codex</text>
    <rect x="196" y="134" width="180" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="286" y="150" text-anchor="middle">Claude Code / Desktop</text>
    <rect x="388" y="134" width="130" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="453" y="150" text-anchor="middle">Antigravity</text>
    <rect x="530" y="134" width="100" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="580" y="150" text-anchor="middle">Trae</text>
    <rect x="642" y="134" width="175" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="729" y="150" text-anchor="middle">WorkBuddy / Hermes</text>
    <rect x="829" y="134" width="230" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="944" y="150" text-anchor="middle">Governed stdio / HTTP MCP</text>
  </g>

  <line x1="290" y1="170" x2="290" y2="200" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="170" x2="820" y2="200" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 2 Left -->
  <rect x="40" y="204" width="505" height="132" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="204" width="6" height="132" rx="3" fill="url(#gPurple)"/>
  <text x="64" y="230" fill="#c084fc" font-size="14" font-weight="700">Semantic Ingestion Gate &amp; Event Bus (v6/event_projector.py)</text>
  <text x="64" y="254" fill="#cbd5e1" font-size="12">• Content-hash deduplication + strict per-host batch isolation</text>
  <text x="64" y="276" fill="#cbd5e1" font-size="12">• User rules / decisions / corrections → high-priority memory + occurred_start</text>
  <text x="64" y="298" fill="#cbd5e1" font-size="12">• Procedural assistant reports / tool outputs → work_ledger only (zero noise)</text>
  <text x="64" y="320" fill="#94a3b8" font-size="11.5">• Strict Code/Data separation (EP_CODE_ROOT ≠ EP_DATA_ROOT)</text>

  <!-- Layer 2 Right -->
  <rect x="575" y="204" width="505" height="132" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="575" y="204" width="6" height="132" rx="3" fill="url(#gAmber)"/>
  <text x="599" y="230" fill="#fbbf24" font-size="14" font-weight="700">v6 Unified Control Plane (2 Resident Services)</text>
  <rect x="599" y="244" width="222" height="78" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="611" y="264" fill="#fde68a" font-size="12.5" font-weight="700">Model Router (:12095)</text>
  <text x="611" y="283" fill="#cbd5e1" font-size="11">6 scoped failover chains</text>
  <text x="611" y="299" fill="#cbd5e1" font-size="11">Circuit breaker + telemetry</text>
  <text x="611" y="314" fill="#94a3b8" font-size="10.5">OpenAI-compatible proxy</text>

  <rect x="836" y="244" width="226" height="78" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="848" y="264" fill="#fde68a" font-size="12.5" font-weight="700">Scheduler Daemon (:12096)</text>
  <text x="848" y="283" fill="#cbd5e1" font-size="11">Consolidates 7 background jobs</text>
  <text x="848" y="299" fill="#cbd5e1" font-size="11">SQLite state + exp. backoff</text>
  <text x="848" y="314" fill="#94a3b8" font-size="10.5">/health · /jobs · /trigger</text>

  <line x1="290" y1="336" x2="290" y2="366" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="336" x2="820" y2="366" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="40" y="370" width="1040" height="154" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="370" width="6" height="154" rx="3" fill="url(#gGreen)"/>
  <text x="64" y="396" fill="#34d399" font-size="14" font-weight="700">Storage, Graph Governance &amp; Dual-Engine Auditable Retrieval (Postgres 18 + Controller :12079)</text>

  <rect x="64" y="410" width="235" height="98" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="78" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">Memory Graph (public)</text>
  <text x="78" y="452" fill="#cbd5e1" font-size="11">memory_units / documents</text>
  <text x="78" y="470" fill="#cbd5e1" font-size="11">Top-10 semantic edge pruning</text>
  <text x="78" y="488" fill="#94a3b8" font-size="10.5">14d audit prune · small batches</text>

  <rect x="315" y="410" width="235" height="98" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="329" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">Work Ledger &amp; State</text>
  <text x="329" y="452" fill="#cbd5e1" font-size="11">ep_events.work_ledger</text>
  <text x="329" y="470" fill="#cbd5e1" font-size="11">ep_events.project_state (O(1))</text>
  <text x="329" y="488" fill="#94a3b8" font-size="10.5">Turns · actions · artifacts</text>

  <rect x="566" y="410" width="235" height="98" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="580" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">5D Preferences &amp; Models</text>
  <text x="580" y="452" fill="#cbd5e1" font-size="11">Zero-LLM noise prefilter</text>
  <text x="580" y="470" fill="#cbd5e1" font-size="11">Single-dim high-evidence models</text>
  <text x="580" y="488" fill="#94a3b8" font-size="10.5">7d receipt rolling cleanup</text>

  <rect x="817" y="410" width="244" height="98" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="831" y="432" fill="#7dd3fc" font-size="12.5" font-weight="700">Auditable Retrieval</text>
  <text x="831" y="452" fill="#cbd5e1" font-size="11">user_recall / user_research</text>
  <text x="831" y="470" fill="#cbd5e1" font-size="11">ep_exhaustive_search (100% SQL)</text>
  <text x="831" y="488" fill="#94a3b8" font-size="10.5">read_source · Console :9999</text>
</svg>
