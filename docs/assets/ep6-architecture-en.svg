<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1120" height="580" rx="16" fill="url(#bg)"/>
  <text x="40" y="46" fill="#f8fafc" font-size="24" font-weight="700">Evolving Profile 6.1.0 — Cross-Platform Adaptive Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Zero-Shell Control Plane · Postgres 18 / pgvector 0.8 Auto-Tuned Kernel · Bi-Temporal Entity State · Guardrail Preferences · Golden Eval Gate</text>

  <!-- Layer 1: Multi-Host -->
  <rect x="40" y="92" width="1040" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="92" width="6" height="74" rx="3" fill="url(#gBlue)"/>
  <text x="64" y="118" fill="#38bdf8" font-size="13" font-weight="700">Multi-Host Surface Layer (MCP + Hooks + Native Transcript Adapters · macOS / Windows / Linux)</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="64" y="130" width="120" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="124" y="146" text-anchor="middle">Codex</text>
    <rect x="196" y="130" width="180" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="286" y="146" text-anchor="middle">Claude Code / Desktop</text>
    <rect x="388" y="130" width="130" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="453" y="146" text-anchor="middle">Antigravity</text>
    <rect x="530" y="130" width="100" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="580" y="146" text-anchor="middle">Trae</text>
    <rect x="642" y="130" width="175" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="729" y="146" text-anchor="middle">WorkBuddy / Hermes</text>
    <rect x="829" y="130" width="230" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="944" y="146" text-anchor="middle">Governed stdio / HTTP MCP</text>
  </g>

  <line x1="290" y1="166" x2="290" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="166" x2="820" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 2 Left -->
  <rect x="40" y="200" width="505" height="136" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="200" width="6" height="136" rx="3" fill="url(#gPurple)"/>
  <text x="64" y="226" fill="#c084fc" font-size="14" font-weight="700">Semantic Gate &amp; Ontology Hygiene (event_projector + ontology_hygiene)</text>
  <text x="64" y="250" fill="#cbd5e1" font-size="12">• Content-hash dedup + strict per-host batch isolation + occurred_start anchor</text>
  <text x="64" y="272" fill="#cbd5e1" font-size="12">• Unconfirmed assistant statements soft-demoted (recall_demoted), kept auditable</text>
  <text x="64" y="294" fill="#cbd5e1" font-size="12">• Automated cleanup of test banks, orphan HNSW indexes, singletons &amp; SQLite</text>
  <text x="64" y="316" fill="#94a3b8" font-size="11.5">• Strict Code/Data separation (EP_CODE_ROOT ≠ EP_DATA_ROOT, v6/bootstrap.py)</text>

  <!-- Layer 2 Right -->
  <rect x="575" y="200" width="505" height="136" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="575" y="200" width="6" height="136" rx="3" fill="url(#gAmber)"/>
  <text x="599" y="226" fill="#fbbf24" font-size="14" font-weight="700">v6.1 Unified Control Plane (Zero-Shell Pure Python)</text>
  <rect x="599" y="240" width="222" height="84" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="611" y="260" fill="#fde68a" font-size="12.5" font-weight="700">Model Router (:12095)</text>
  <text x="611" y="279" fill="#cbd5e1" font-size="11">Strict primary failover default</text>
  <text x="611" y="295" fill="#cbd5e1" font-size="11">6 scoped circuit breakers</text>
  <text x="611" y="311" fill="#94a3b8" font-size="10.5">OpenAI-compatible proxy</text>

  <rect x="836" y="240" width="226" height="84" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="848" y="260" fill="#fde68a" font-size="12.5" font-weight="700">Scheduler Daemon (:12096)</text>
  <text x="848" y="279" fill="#cbd5e1" font-size="11">13 jobs · zero .zsh dependency</text>
  <text x="848" y="295" fill="#cbd5e1" font-size="11">Event wake + SQLite backoff</text>
  <text x="848" y="311" fill="#94a3b8" font-size="10.5">pg_analyze · sqlite &amp; ontology</text>

  <line x1="290" y1="336" x2="290" y2="366" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="336" x2="820" y2="366" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="40" y="370" width="1040" height="174" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="370" width="6" height="174" rx="3" fill="url(#gGreen)"/>
  <text x="64" y="396" fill="#34d399" font-size="14" font-weight="700">Adaptive Postgres 18 / pgvector 0.8 Kernel · Bi-Temporal State · Trust Rerank &amp; Console (:12079 / :9999)</text>

  <rect x="64" y="410" width="235" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="78" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">Adaptive Postgres 18</text>
  <text x="78" y="452" fill="#cbd5e1" font-size="11">pg_autotune (RAM/CPU adaptive)</text>
  <text x="78" y="470" fill="#cbd5e1" font-size="11">hnsw.iterative_scan=relaxed_order</text>
  <text x="78" y="488" fill="#cbd5e1" font-size="11">jit=off · idle_tx=60s · pg_stat</text>
  <text x="78" y="506" fill="#94a3b8" font-size="10.5">IDF entity graph + Top-10 prune</text>

  <rect x="315" y="410" width="235" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="329" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">Bi-Temporal Entity State</text>
  <text x="329" y="452" fill="#cbd5e1" font-size="11">ep_events.entity_state (O(1))</text>
  <text x="329" y="470" fill="#cbd5e1" font-size="11">project / service / client / config</text>
  <text x="329" y="488" fill="#cbd5e1" font-size="11">valid_from · valid_to · superseded</text>
  <text x="329" y="506" fill="#94a3b8" font-size="10.5">ep_events.work_ledger (all hosts)</text>

  <rect x="566" y="410" width="235" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="580" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">5D Preferences &amp; Guardrails</text>
  <text x="580" y="452" fill="#cbd5e1" font-size="11">hard_guardrail prioritized first</text>
  <text x="580" y="470" fill="#cbd5e1" font-size="11">global / project / task_local scope</text>
  <text x="580" y="488" fill="#cbd5e1" font-size="11">Zero duplicate active models</text>
  <text x="580" y="506" fill="#94a3b8" font-size="10.5">Constellation badges · 7d cleanup</text>

  <rect x="817" y="410" width="244" height="118" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="831" y="432" fill="#7dd3fc" font-size="12.5" font-weight="700">Auditable Recall &amp; Eval Gate</text>
  <text x="831" y="452" fill="#cbd5e1" font-size="11">user_recall + trust/state rerank</text>
  <text x="831" y="470" fill="#cbd5e1" font-size="11">ep_exhaustive_search (100% SQL)</text>
  <text x="831" y="488" fill="#cbd5e1" font-size="11">v6/eval_harness.py quality gate</text>
  <text x="831" y="506" fill="#94a3b8" font-size="10.5">Flow &amp; Constellation UI :9999</text>
</svg>
