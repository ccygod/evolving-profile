<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1120" height="580" rx="16" fill="url(#bg)"/>
  <text x="40" y="46" fill="#f8fafc" font-size="24" font-weight="700">Evolving Profile 6.1.0 — 跨平台自适应架构总览</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">零 Shell 跨平台控制面 · Postgres 18 / pgvector 0.8 自适应内核 · 双时态实体状态 · 红线偏好治理 · 黄金质量门禁</text>

  <!-- Layer 1: Multi-Host -->
  <rect x="40" y="92" width="1040" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="92" width="6" height="74" rx="3" fill="url(#gBlue)"/>
  <text x="64" y="118" fill="#38bdf8" font-size="13" font-weight="700">多宿主接入层（MCP + Hook + 原生日志适配器 · macOS / Windows / Linux）</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="64" y="130" width="130" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="129" y="146" text-anchor="middle">Codex</text>
    <rect x="206" y="130" width="170" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="291" y="146" text-anchor="middle">Claude Code / Desktop</text>
    <rect x="388" y="130" width="130" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="453" y="146" text-anchor="middle">Antigravity</text>
    <rect x="530" y="130" width="110" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="585" y="146" text-anchor="middle">Trae</text>
    <rect x="652" y="130" width="175" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="739" y="146" text-anchor="middle">WorkBuddy / Hermes</text>
    <rect x="839" y="130" width="220" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="949" y="146" text-anchor="middle">受治理 stdio / HTTP MCP</text>
  </g>

  <line x1="290" y1="166" x2="290" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="166" x2="820" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 2 Left: Event Bus & Semantic Gate -->
  <rect x="40" y="200" width="505" height="136" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="200" width="6" height="136" rx="3" fill="url(#gPurple)"/>
  <text x="64" y="226" fill="#c084fc" font-size="14" font-weight="700">语义写入门控 &amp; 本体治理引擎（event_projector + ontology_hygiene）</text>
  <text x="64" y="250" fill="#cbd5e1" font-size="12">• 写入去重（content_sha256）+ 按宿主隔离批次 + 会话时间锚点（occurred_start）</text>
  <text x="64" y="272" fill="#cbd5e1" font-size="12">• 未确认助手陈述自动软降权（recall_demoted），仅入 work_ledger 不污染主召回</text>
  <text x="64" y="294" fill="#cbd5e1" font-size="12">• 定期清理测试 Bank、孤儿局部 HNSW 索引、单次孤立实体与 SQLite 捕获库</text>
  <text x="64" y="316" fill="#94a3b8" font-size="11.5">• 代码与数据彻底分离（EP_CODE_ROOT ≠ EP_DATA_ROOT，v6/bootstrap.py）</text>

  <!-- Layer 2 Right: Unified Runtime Control Plane -->
  <rect x="575" y="200" width="505" height="136" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="575" y="200" width="6" height="136" rx="3" fill="url(#gAmber)"/>
  <text x="599" y="226" fill="#fbbf24" font-size="14" font-weight="700">v6.1 跨平台统一控制面（零 Shell 依赖 · 纯 Python 常驻）</text>
  <rect x="599" y="240" width="222" height="84" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="611" y="260" fill="#fde68a" font-size="12.5" font-weight="700">Model Router (:12095)</text>
  <text x="611" y="279" fill="#cbd5e1" font-size="11">默认严格主备 Failover</text>
  <text x="611" y="295" fill="#cbd5e1" font-size="11">6 Scope 熔断 + 探活遥测</text>
  <text x="611" y="311" fill="#94a3b8" font-size="10.5">OpenAI 兼容本地网关</text>

  <rect x="836" y="240" width="226" height="84" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="848" y="260" fill="#fde68a" font-size="12.5" font-weight="700">Scheduler Daemon (:12096)</text>
  <text x="848" y="279" fill="#cbd5e1" font-size="11">13 项后台作业零 .zsh 依赖</text>
  <text x="848" y="295" fill="#cbd5e1" font-size="11">事件唤醒 + SQLite 指数退避</text>
  <text x="848" y="311" fill="#94a3b8" font-size="10.5">自动巡检 · pg_analyze · hygiene</text>

  <line x1="290" y1="336" x2="290" y2="366" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="336" x2="820" y2="366" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 3: Storage & Retrieval -->
  <rect x="40" y="370" width="1040" height="174" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="370" width="6" height="174" rx="3" fill="url(#gGreen)"/>
  <text x="64" y="396" fill="#34d399" font-size="14" font-weight="700">自适应 Postgres 18 / pgvector 0.8 内核 · 双时态状态 · 信任重排与控制台（:12079 / :9999）</text>

  <rect x="64" y="410" width="235" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="78" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">Postgres 18 自适应内核</text>
  <text x="78" y="452" fill="#cbd5e1" font-size="11">pg_autotune 按内存/CPU 自适配</text>
  <text x="78" y="470" fill="#cbd5e1" font-size="11">hnsw.iterative_scan 迭代召回</text>
  <text x="78" y="488" fill="#cbd5e1" font-size="11">jit=off · idle_tx=60s · 慢 SQL</text>
  <text x="78" y="506" fill="#94a3b8" font-size="10.5">IDF 实体图谱 + Top-10 语义剪枝</text>

  <rect x="315" y="410" width="235" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="329" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">双时态状态 &amp; 工作台账</text>
  <text x="329" y="452" fill="#cbd5e1" font-size="11">ep_events.entity_state (O(1))</text>
  <text x="329" y="470" fill="#cbd5e1" font-size="11">project / service / client / config</text>
  <text x="329" y="488" fill="#cbd5e1" font-size="11">valid_from · valid_to · superseded</text>
  <text x="329" y="506" fill="#94a3b8" font-size="10.5">ep_events.work_ledger 全宿主台账</text>

  <rect x="566" y="410" width="235" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="580" y="432" fill="#6ee7b7" font-size="12.5" font-weight="700">五维偏好与红线分级</text>
  <text x="580" y="452" fill="#cbd5e1" font-size="11">hard_guardrail 红线优先置顶</text>
  <text x="580" y="470" fill="#cbd5e1" font-size="11">global / project / task_local 隔离</text>
  <text x="580" y="488" fill="#cbd5e1" font-size="11">活跃认知模型零重复自动去重</text>
  <text x="580" y="506" fill="#94a3b8" font-size="10.5">星座图红线高亮 · 7天回执清理</text>

  <rect x="817" y="410" width="244" height="118" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="831" y="432" fill="#7dd3fc" font-size="12.5" font-weight="700">可审计检索与黄金门禁</text>
  <text x="831" y="452" fill="#cbd5e1" font-size="11">user_recall + 信任/双时态重排</text>
  <text x="831" y="470" fill="#cbd5e1" font-size="11">ep_exhaustive_search (100% SQL)</text>
  <text x="831" y="488" fill="#cbd5e1" font-size="11">v6/eval_harness.py 自动化门禁</text>
  <text x="831" y="506" fill="#94a3b8" font-size="10.5">Web 全链路 &amp; 降噪星座图 :9999</text>
</svg>
